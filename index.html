<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>N2 日本語 · 學習與測驗</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇯🇵</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button class="brand" data-go="home">N2<span>日本語</span></button>
  <nav class="tabs">
    <button data-go="home">首頁</button>
    <button data-go="vocab">單字</button>
    <button data-go="grammar">文法</button>
    <button data-go="quiz">測驗</button>
    <button data-go="stats">統計</button>
  </nav>
  <button class="icon-btn" id="btn-settings" aria-label="設定">⚙</button>
</header>

<div class="display-bar">
  <span class="db-label">顯示</span>
  <button class="chip" data-toggle="showFurigana">假名</button>
  <button class="chip" data-toggle="showZh">中譯</button>
  <button class="chip" data-toggle="showEn">EN</button>
  <button class="chip" data-toggle="showEx">例句</button>
  <span class="db-spacer"></span>
  <button class="chip" data-toggle="autoSpeak">自動朗讀</button>
</div>

<main id="app"></main>

<div class="sheet-backdrop" id="settings-backdrop" hidden>
  <section class="sheet" role="dialog" aria-label="設定">
    <h2>設定</h2>
    <label class="row"><span>字級</span>
      <input type="range" id="set-fontsize" min="90" max="150" step="5"></label>
    <label class="row"><span>朗讀語速</span>
      <input type="range" id="set-rate" min="0.5" max="1.3" step="0.05"></label>
    <label class="row"><span>朗讀語音</span>
      <select id="set-voice"></select></label>
    <label class="row"><span>深色模式</span>
      <select id="set-theme">
        <option value="auto">跟隨系統</option>
        <option value="light">淺色</option>
        <option value="dark">深色</option>
      </select></label>
    <hr>
    <div class="row"><span>學習紀錄</span>
      <span class="btn-group">
        <button class="btn ghost" id="btn-export">匯出</button>
        <button class="btn ghost" id="btn-import">匯入</button>
        <button class="btn danger" id="btn-reset">清除</button>
      </span></div>
    <input type="file" id="import-file" accept="application/json" hidden>
    <button class="btn primary wide" id="btn-close-settings">完成</button>
  </section>
</div>

<script src="data/vocab.js"></script>
<script src="data/grammar.js"></script>
<script src="data/vocab_list.js"></script>
<script src="data/grammar_list.js"></script>
<script src="js/decks.js"></script>
<script src="js/core.js"></script>
<script src="js/browse.js"></script>
<script src="js/cards.js"></script>
<script src="js/quiz.js"></script>
<script src="js/stats.js"></script>
<script src="js/app.js"></script>
</body>
</html>
